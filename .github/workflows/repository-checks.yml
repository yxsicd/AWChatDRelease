name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n install.sh scripts/smoke-test.sh
      - name: Validate release manifests
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          platform_assets = {
              "linux-arm64": "awchatd-linux-arm64.tar.gz",
              "linux-amd64": "awchatd-linux-amd64.tar.gz",
          }
          for path in pathlib.Path("releases").glob("*/manifest.json"):
              value = json.loads(path.read_text())
              assert value["schema"] == "awchatd.release-manifest.v1"
              assert len(value["sourceRevision"]) == 40
              platforms = value["platforms"]
              assert platforms and len(platforms) == len(set(platforms))
              assert all(platform in platform_assets for platform in platforms)
              expected_assets = {platform_assets[platform] for platform in platforms}
              assert set(value["assets"]) == expected_assets | {"SHA256SUMS"}
              assert set(value["assetSha256"]) == expected_assets
              assert all(len(value["assetSha256"][asset]) == 64 for asset in expected_assets)
          PY
