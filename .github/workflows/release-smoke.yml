name: Release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing AWChatDRelease tag
        required: true
        default: v0.9.0-awchatd.4db4461

permissions:
  contents: read

jobs:
  install-deploy-smoke:
    name: Install and smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${EVENT_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - name: Install release asset
        env:
          AWCHATD_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./install.sh "$RUNNER_TEMP/awchatd"
      - name: Start isolated deployment and smoke test
        run: |
          source_revision="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceRevision"])' "$RUNNER_TEMP/awchatd/share/awchatd/RELEASE.json")"
          ./scripts/smoke-test.sh "$RUNNER_TEMP/awchatd" "$source_revision"
